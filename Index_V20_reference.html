h:430px;margin:8vh auto}.alert{padding:12px;border-radius:12px;background:#fff3d9}.success{padding:12px;border-radius:12px;background:#e9f7ef}.danger{padding:12px;border-radius:12px;background:#fdecea}.event{padding:11px;border-left:4px solid var(--b);background:#f8fbfd;margin:8px 0;border-radius:8px}.small{font-size:12px}.qr{width:240px;max-width:100%;height:auto;display:block;margin:auto}.bottom{display:none}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.grid,.grid2{grid-template-columns:1fr}.wrap{padding:10px 9px 82px}.nav{display:none}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:7px;left:7px;right:7px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;z-index:30;box-shadow:0 8px 30px #14375522}.bottom button{border:0;background:transparent;padding:9px 3px;font-size:11px;font-weight:700;color:var(--muted)}.top{padding:10px}.brand{font-size:16px}}
</style></head><body><div id="app"></div><script>
const BOOT=<?!= JSON.stringify(boot||{}) ?>;const S={token:localStorage.getItem('gmf_token')||'',user:null,page:'login',nav:0,scanner:null,scanGen:0,timer:null,scannerUrl:'',scannerLaunchUrl:''};
const $=id=>document.getElementById(id);const val=id=>{const e=$(id);return e?e.value:''};const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,bad=false){const x=document.createElement('div');x.textContent=msg;x.style='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:100;background:'+(bad?'#b42318':'#063b67')+';color:#fff;padding:12px 16px;border-radius:12px;max-width:92vw';document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function call(fn,args=[],auth=true){return new Promise((resolve,reject)=>{if(typeof google==='undefined'||!google.script||!google.script.run)return reject(new Error('This page is not running as a Google Apps Script Web App. Open the deployed /exec URL.'));let r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>{const m=String(e&&e.message||e);if(m.includes('SESSION_EXPIRED')){localStorage.removeItem('gmf_token');S.token='';S.user=null;loginPage()}reject(e)});const a=args.slice();if(auth)a.unshift(S.token);try{if(typeof r[fn]!=='function')return reject(new Error('Server function unavailable: '+fn));r[fn].apply(r,a)}catch(e){reject(e)}})}
async function stopScan(){const q=S.scanner;S.scanner=null;S.scanGen++;if(!q)return;try{await q.stop()}catch(e){}try{q.clear()}catch(e){}}
function stopBg(){if(S.timer){clearInterval(S.timer);S.timer=null}stopScan()}
function page(name){stopBg();S.page=name;S.nav++}
function shell(active){const u=S.user||{};return '<div class="top"><div class="topin"><div><div class="brand">GMF QR Traceability V20</div><div class="small">'+esc(u.name)+' · '+esc(u.role)+'</div></div><button class="btn secondary" id="logoutBtn">Logout</button></div></div><div class="wrap"><div class="nav"><button class="btn '+(active==='dash'?'':'secondary')+'" data-nav="dash">Dashboard</button><button class="btn secondary" data-nav="scan">Scan</button><button class="btn secondary" data-nav="bins">Bins</button><button class="btn secondary" data-nav="qr">QR</button>'+((u.allowQC||u.allowAdmin)?'<button class="btn secondary" data-nav="qc">QC</button>':'')+((u.allowPacking||u.allowAdmin)?'<button class="btn secondary" data-nav="packing">Packing</button>':'')+((u.allowAdmin||String(u.role).toUpperCase()==='HOD'||String(u.role).toUpperCase()==='HEAD OF DEPARTMENT')?'<button class="btn secondary" data-nav="admin">Masters</button>':'')+'</div><div id="content"></div></div><div class="bottom"><button data-nav="dash">⌂<br>Home</button><button data-nav="scan">▣<br>Scan</button><button data-nav="bins">▤<br>Bins</button><button data-nav="qc">✓<br>QC</button><button data-nav="packing">▣<br>Pack</button><button data-nav="admin">⚙<br>Masters</button></div></div>'}
function wireNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));$('logoutBtn')?.addEventListener('click',logout)}
function go(name){if(name==='dash')return home();if(name==='scan')return scanPage();if(name==='bins')return binsPage();if(name==='qr')return qrPage();if(name==='qc')return qcPage();if(name==='packing')return packingPage();if(name==='admin')return adminPage()}
function loginPage(){stopBg();S.page='login';$('app').innerHTML='<div class="card login"><h1>GMF QR Traceability</h1><p class="muted">Secure production, QC and packing control</p><div class="stack"><input id="loginId" class="input" placeholder="Login ID" autocomplete="username"><input id="loginPin" class="input" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password"><button id="loginBtn" class="btn">Sign In</button></div></div>';$('loginBtn').onclick=doLogin;$('loginPin').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
async function doLogin(){const b=$('loginBtn');b.disabled=true;try{const r=await call('login',[val('loginId'),val('loginPin')],false);S.token=r.token;S.user=r.user;localStorage.setItem('gmf_token',S.token);if(r.user.forcePin)changePinPage();else afterLogin()}catch(e){toast(e.message||e,true)}finally{b.disabled=false}}
function parseScan(text){try{const u=new URL(text);return {raw:text,bin:u.searchParams.get('bin')||'',wc:u.searchParams.get('wc')||'',pack:u.searchParams.get('pack')||'',trace:u.searchParams.get('trace')||''}}catch(e){const t=String(text||'').trim();return {raw:t,bin:/^BIN-/i.test(t)?t:'',wc:/^(BFG|NFG|HT|COATING|NTAP|PACK)/i.test(t)?t:''}}}
function webBase(){return String(BOOT.webUrl||location.href).replace(/[?&](wc|bin|pack|trace|scan)=[^&]*/g,'').replace(/[?&]$/,'')}
async function loadScannerConfig(mode){try{const r=await call('getScannerConfig',[mode||'ANY']);S.scannerUrl=r.scannerUrl||'';S.scannerLaunchUrl=r.launchUrl||'';return r}catch(e){return {scannerUrl:'',launchUrl:''}}}
async function launchExternalScanner(mode){try{if(S.scannerLaunchUrl&&S.scannerUrl){window.location.href=S.scannerLaunchUrl;return}const r=await loadScannerConfig(mode||'ANY');if(!r.scannerUrl||!r.launchUrl){toast('Scanner is not configured. Admin must save the HTTPS Scanner URL.',true);return}window.location.href=r.launchUrl}catch(e){toast(e.message||'Unable to open camera scanner.',true)}}
function afterLogin(){if(BOOT.scan){const x=parseScan(BOOT.scan);if(x.bin)return openBin(x.bin,x.wc||'');if(x.wc)return openWC(x.wc);if(x.pack)return window.location.href=webBase()+'?pack='+encodeURIComponent(x.pack);if(x.trace)return window.location.href=webBase()+'?trace='+encodeURIComponent(x.trace)}if(BOOT.bin)return openBin(BOOT.bin);if(BOOT.wc)return openWC(BOOT.wc);home()}
function changePinPage(){page('pin');$('app').innerHTML='<div class="card login"><h1>Change PIN</h1><p class="muted">A new PIN is required.</p><div class="stack"><input id="newPin" class="input" type="password" inputmode="numeric" placeholder="New 4-8 digit PIN"><input id="confirmPin" class="input" type="password" inputmode="numeric" placeholder="Confirm PIN"><button id="savePinBtn" class="btn">Save PIN</button></div></div>';$('savePinBtn').onclick=savePin}
async function savePin(){if(val('newPin')!==val('confirmPin'))return toast('PINs do not match',true);const b=$('savePinBtn');b.disabled=true;try{const r=await call('changeMyPin',[val('newPin')]);S.user=r.user;S.token=r.token;localStorage.setItem('gmf_token',S.token);toast('PIN changed successfully');afterLogin()}catch(e){toast(e.message||e,true)}finally{b.disabled=false}}
async function home(){page('dash');$('app').innerHTML=shell('dash');wireNav();await refreshDash();if(S.page==='dash')S.timer=setInterval(()=>{if(S.page==='dash')refreshDash()},15000)}
async function refreshDash(){try{const d=await call('dashboard');if(S.page!=='dash')return;const c=d.counts;const target=$('content');if(!target)return;target.innerHTML='<div class="row" style="justify-content:space-between"><div><h1>Live Dashboard</h1><p class="muted">Auto refresh every 15 seconds · '+esc(new Date().toLocaleTimeString())+'</p></div><button class="btn" id="dashScan">Scan Work Centre</button></div><div class="grid">'+[['TOTAL','Total'],['WAITING','Waiting'],['IN_PROCESS','In Process'],['WAITING_QC','Waiting QC'],['HOLD','Hold'],['REJECTED','Rejected'],['COMPLETED','Completed']].map(x=>'<div class="card"><span class="muted">'+x[1]+'</span><b style="font-size:30px;display:block">'+(c[x[0]]||0)+'</b></div>').join('')+'</div><div class="grid2"><div class="card"><h2>Work Centre Load</h2>'+Object.keys(d.byProcess||{}).map(k=>'<div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid #edf2f6"><span>'+esc(k)+'</span><b>'+d.byProcess[k]+'</b></div>').join('')+'</div><div class="card"><h2>QC Queue</h2><div class="success"><b>'+d.qcPending+'</b> bin(s) waiting for QC release.</div></div></div>';$('dashScan').onclick=scanPage}catch(e){if(S.page==='dash')toast(e.message||e,true)}}
async function scanPage(){page('scan');$('app').innerHTML=shell('scan');wireNav();$('content').innerHTML='<div class="grid2"><div class="card"><h1>Scan QR</h1><div class="scan"><div style="text-align:center;padding:22px"><div style="font-size:48px">📷</div><h2>Camera Scanner</h2><p class="muted">Secure camera scanner for Android, iPhone, tablet and PC.</p><button id="startExternal" class="btn">Start Camera Scanner</button><p class="small muted">Allow camera permission when your browser asks.</p></div></div></div><div class="card"><h2>Manual fallback</h2><div class="stack"><input id="manualId" class="input" placeholder="BIN-xxxx or Work Centre ID"><button id="manualOpen" class="btn">Open</button></div><p class="muted">Recommended: Scan Work Centre QR, then scan Bin QR.</p></div></div>';$('startExternal').onclick=()=>launchExternalScanner('ANY');$('manualOpen').onclick=manualOpen;loadScannerConfig('ANY')}
async function openWC(id){page('scan-wc');const seq=S.nav;try{const wcs=await call('listWorkCentres');if(S.page!=='scan-wc'||S.nav!==seq)return;const w=wcs.find(x=>String(x.id).toUpperCase()===String(id).toUpperCase());if(!w)throw Error('Work Centre not found or not assigned.');await loadScannerConfig('BIN');$('app').innerHTML=shell('scan');wireNav();$('content').innerHTML='<div class="card"><h1>'+esc(w.name)+'</h1><span class="pill">'+esc(w.id)+'</span><p>'+esc(w.description)+'</p><div class="scan"><div style="text-align:center;padding:22px"><div style="font-size:48px">📷</div><h2>Scan Bin QR</h2><p class="muted">Camera runs on the secure external scanner page.</p><button id="startWcScanner" class="btn">Start Camera Scanner</button></div></div><div class="row"><button id="manual2" class="btn secondary">Enter Bin Manually</button></div></div>';$('startWcScanner').onclick=()=>launchExternalScanner('BIN');$('manual2').onclick=()=>{const bid=prompt('Enter Bin ID');if(bid)openBin(bid,w.id)}}catch(e){if(S.page==='scan-wc')toast(e.message||'Unable to open Work Centre.',true)}}

async function openBin(id,wc){await stopScan();page('process');const seq=S.nav;try{const a=await call('nextAction',[String(id).trim().toUpperCase(),wc||'']);if(S.page!=='process'||S.nav!==seq)return;if(a.type==='NEW_BIN')return claimBinPage(a.bin.binId,wc);if(a.type!=='PROCESS')return traceCard(a.bin,a.message);renderProcess(a.bin,wc||a.bin.currentWc)}catch(e){toast(e.message||e,true)}}
function info(label,value){return '<div class="card"><span class="small muted">'+esc(label)+'</span><br><b>'+esc(value==null||value===''?'—':value)+'</b></div>'}
function renderProcess(b,wc){$('app').innerHTML=shell('scan');wireNav();const first=Number(b.sequence)===1;$('content').innerHTML='<div class="card"><div class="row" style="justify-content:space-between"><div><h1>'+esc(b.binId)+'</h1><span class="pill" id="liveStatus">'+esc(b.status)+'</span> <span class="pill">'+esc(b.currentWc)+'</span></div><button id="backScan" class="btn secondary">Back</button></div><div class="grid2">'+info('Part',b.partNo)+info('Product Grade',b.productGrade)+info('RM Grade',b.rawMaterialGrade)+info('Coil No.',b.coilNo)+info('SO',b.salesOrder)+info('MO',b.manufacturingOrder)+info('Lot Qty',b.lotQty)+info('Bin Qty Nos',b.binQtyNos)+info('Bin Qty Weight',b.binQtyWeight)+'</div><div class="card"><h2>Process Entry</h2>'+(first?'<div class="grid2"><input id="so" class="input" placeholder="Sales Order" value="'+esc(b.salesOrder)+'"><input id="mo" class="input" placeholder="Manufacturing Order" value="'+esc(b.manufacturingOrder)+'"><input id="coil" class="input" placeholder="Coil No." value="'+esc(b.coilNo)+'"><input id="rmg" class="input" placeholder="RM Grade" value="'+esc(b.rawMaterialGrade)+'"><input id="pg" class="input" placeholder="Product Grade" value="'+esc(b.productGrade)+'"><input id="lot" class="input" type="number" placeholder="Total Lot Qty" value="'+esc(b.lotQty)+'"><input id="bn" class="input" type="number" placeholder="Bin Qty Nos" value="'+esc(b.binQtyNos)+'"><input id="bw" class="input" type="number" placeholder="Bin Qty Weight" value="'+esc(b.binQtyWeight)+'"></div>':'')+'<div class="grid2"><input id="shift" class="input" placeholder="Shift" value="A"><input id="machine" class="input" placeholder="Machine No."><select id="coat" class="input"><option value="">Coating type</option><option>HDG</option><option>ELP</option><option>ZINC_NICKEL</option><option>PTFE</option></select><input id="inNos" class="input" type="number" placeholder="Input Qty Nos"><input id="inWt" class="input" type="number" placeholder="Input Qty Weight"><input id="outNos" class="input" type="number" placeholder="Output Qty Nos"><input id="outWt" class="input" type="number" placeholder="Output Qty Weight"></div><textarea id="rem" class="input" rows="3" placeholder="Remarks"></textarea><div class="row"><button id="startBtn" class="btn">Start Process</button><button id="completeBtn" class="btn good">Complete Process</button></div><div class="success small">Batch is assigned automatically. Every completion goes to QC.</div></div></div>';$('backScan').onclick=scanPage;$('startBtn').onclick=()=>startProc(b.binId,b.currentWc);$('completeBtn').onclick=()=>completeProc(b.binId,b.currentWc);startLive(b.binId,b.currentWc)}
function startLive(id,wc){if(S.timer)clearInterval(S.timer);S.timer=setInterval(async()=>{if(S.page!=='process'){clearInterval(S.timer);S.timer=null;return}try{const a=await call('nextAction',[id,wc]);const e=$('liveStatus');if(e)e.textContent=a.bin.status}catch(e){}},10000)}
async function startProc(id,wc){const b=$('startBtn');b.disabled=true;try{const d={salesOrder:val('so'),manufacturingOrder:val('mo'),coilNo:val('coil'),rawMaterialGrade:val('rmg'),productGrade:val('pg'),lotQty:Number(val('lot')||0),binQtyNos:Number(val('bn')||0),binQtyWeight:Number(val('bw')||0),shift:val('shift'),machineNo:val('machine'),coatingType:val('coat'),remarks:val('rem')};const r=await call('startProcess',[id,wc,d]);toast('Started · '+r.lastBatchNo);await openBin(id,wc)}catch(e){toast(e.message||e,true)}finally{b.disabled=false}}
async function completeProc(id,wc){const b=$('completeBtn');b.disabled=true;try{const d={inputNos:Number(val('inNos')||0),inputWeight:Number(val('inWt')||0),outputNos:Number(val('outNos')||0),outputWeight:Number(val('outWt')||0),remarks:val('rem')};await call('completeProcess',[id,wc,d]);toast('Completed · waiting for QC');qcPage(id)}catch(e){toast(e.message||e,true)}finally{b.disabled=false}}
async function traceCard(b,msg){page('trace');try{const t=await call('trace',[b.binId]);$('app').innerHTML=shell('bins');wireNav();$('content').innerHTML='<div class="card"><h1>'+esc(t.bin.binId)+'</h1><div class="alert">'+esc(msg||'')+'</div><div class="grid2">'+info('Status',t.bin.status)+info('Current WC',t.bin.currentWc)+info('SO',t.bin.salesOrder)+info('MO',t.bin.manufacturingOrder)+info('Grade',t.bin.productGrade)+info('Route',t.bin.routeId)+'</div></div><div class="card"><h2>Traceability</h2>'+t.processes.map(x=>'<div class="event"><b>'+esc(x.wc)+' · '+esc(x.batch)+'</b><br>'+esc(x.operator)+' · '+esc(x.status)+'<br>'+esc(x.remarks)+'</div>').join('')+'</div>'}catch(e){toast(e.message||e,true)}}
function openTrace(id){traceCard({binId:id},'Customer trace is read-only.')}
async function binsPage(){page('bins');$('app').innerHTML=shell('bins');wireNav();$('content').innerHTML='<div class="card"><div class="row"><h1 style="flex:1">Bins</h1><button id="newBinBtn" class="btn">+ New Bin</button></div><div class="grid2"><div><label class="small muted">Part No. — primary search</label><input id="binPart" class="input" list="binPartList" placeholder="Search / select Part No." autocomplete="off"><datalist id="binPartList"></datalist></div><div><label class="small muted">Other search</label><input id="binSearch" class="input" placeholder="Bin, Grade, SO, MO"></div></div><div class="row"><button id="binPartBtn" class="btn">Search by Part</button><button id="binSearchBtn" class="btn secondary">Search</button><button id="binClearBtn" class="btn secondary">Clear</button></div><div id="binResults"></div></div>';$('newBinBtn').onclick=newBinPage;$('binPartBtn').onclick=()=>searchBins(val('binPart'));$('binSearchBtn').onclick=()=>searchBins(val('binSearch'));$('binClearBtn').onclick=()=>{ $('binPart').value=''; $('binSearch').value=''; searchBins('') };try{const a=await call('partSearch',['']);$('binPartList').innerHTML=a.map(x=>'<option value="'+esc(x.partNo)+'">'+esc(x.description||'')+' · '+esc(x.grade)+'</option>').join('')}catch(e){}await searchBins('')}
async function searchBins(q){try{q=String(q||'').trim()||String(val('binPart')||'').trim();const a=await call('searchBins',[q]);if(S.page!=='bins')return;$('binResults').innerHTML='<div class="tablewrap"><table class="table"><tr><th>Bin</th><th>Part</th><th>Grade</th><th>WC</th><th>Status</th><th>Batch</th><th></th></tr>'+a.map(b=>'<tr><td>'+esc(b.binId)+'</td><td><b>'+esc(b.partNo)+'</b></td><td>'+esc(b.productGrade)+'</td><td>'+esc(b.currentWc)+'</td><td>'+esc(b.status)+'</td><td>'+esc(b.lastBatchNo)+'</td><td><button class="btn secondary open-bin" data-id="'+esc(b.binId)+'">Open</button></td></tr>').join('')+'</table></div>';document.querySelectorAll('.open-bin').forEach(x=>x.onclick=()=>openBin(x.dataset.id))}catch(e){toast(e.message||e,true)}}
async function searchBins(){try{const a=await call('searchBins',[val('binSearch')]);if(S.page!=='bins')return;$('binResults').innerHTML='<div class="tablewrap"><table class="table"><tr><th>Bin</th><th>Part</th><th>Grade</th><th>WC</th><th>Status</th><th>Batch</th><th></th></tr>'+a.map(b=>'<tr><td>'+esc(b.binId)+'</td><td>'+esc(b.partNo)+'</td><td>'+esc(b.productGrade)+'</td><td>'+esc(b.currentWc)+'</td><td>'+esc(b.status)+'</td><td>'+esc(b.lastBatchNo)+'</td><td><button class="btn secondary open-bin" data-id="'+esc(b.binId)+'">Open</button></td></tr>').join('')+'</table></div>';document.querySelectorAll('.open-bin').forEach(x=>x.onclick=()=>openBin(x.dataset.id))}catch(e){toast(e.message||e,true)}}

async function claimBinPage(binId,wc,reuse){page('claimbin');$('app').innerHTML=shell('bins');wireNav();let data;try{data=await call('routeBuilderData')}catch(e){return toast(e.message||e,true)}const parts=data.parts||[];const grades=[...new Set(parts.map(x=>String(x.grade||'').trim()).filter(Boolean))];$('content').innerHTML='<div class="card"><h1>Assign New Permanent Bin</h1><div class="success"><b>'+esc(binId)+'</b> · This QR has never been used. After final packaging it is permanently retired and must be discarded.</div><p class="muted">Select the Part No. first. The system will use the Part Master route automatically.</p><div class="grid2"><div><label class="small muted">Part No. — primary parameter</label><input id="cbPart" class="input" list="cbPartList" placeholder="Search / select Part No." autocomplete="off"><datalist id="cbPartList">'+parts.map(x=>'<option value="'+esc(x.partNo)+'">'+esc(x.description||'')+' · '+esc(x.grade)+'</option>').join('')+'</datalist></div><select id="cbProd" class="input"><option value="BOLT">BOLT</option><option value="NUT">NUT</option></select><select id="cbGrade" class="input"><option value="">Select Product Grade</option>'+grades.map(g=>'<option>'+esc(g)+'</option>').join('')+'</select><input id="cbSize" class="input" placeholder="Size"><input id="cbRM" class="input" placeholder="Raw Material Grade"><input id="cbSO" class="input" placeholder="Sales Order"><input id="cbMO" class="input" placeholder="Manufacturing Order"><input id="cbCoil" class="input" placeholder="Coil No."><input id="cbLot" class="input" type="number" placeholder="Total Lot Qty"><input id="cbNos" class="input" type="number" placeholder="Bin Qty Nos"><input id="cbWt" class="input" type="number" placeholder="Bin Qty Weight"></div><div id="cbPartInfo" class="small muted"></div><button id="claimBtn" class="btn">Claim Bin & Continue</button></div>';

function selectedPartNos(){return Array.from(document.querySelectorAll('#rbPartsList input[type=checkbox]:checked')).map(x=>x.value.toUpperCase())}
function renderMultiParts(){const d=S.rbData||{},prod=(val('rbProd')||'BOLT').toUpperCase(),q=(val('rbPartSearch')||'').trim().toUpperCase();const parts=(d.parts||[]).filter(x=>String(x.productType).toUpperCase()===prod&&(!q||String(x.partNo).toUpperCase().includes(q)||String(x.description||'').toUpperCase().includes(q)));$('rbPartsList').innerHTML=parts.map(x=>'<label style="display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid var(--line)"><input type="checkbox" value="'+esc(x.partNo)+'" data-grade="'+esc(x.grade||'')+'"> <span><b>'+esc(x.partNo)+'</b> · '+esc(x.description||'')+' · Grade '+esc(x.grade||'')+' · Route '+esc(x.routeId||'None')+'</span></label>').join('')||'<div class="muted">No matching active Part Nos.</div>';document.querySelectorAll('#rbPartsList input').forEach(x=>x.onchange=updateRouteId)}
function populateRouteBuilder(){const d=S.rbData||{workCentres:[],parts:[],routes:[],grades:[]},prod=val('rbProd')||'BOLT',parts=(d.parts||[]).filter(x=>String(x.productType).toUpperCase()===prod);$('rbPartList').innerHTML=parts.map(x=>'<option value="'+esc(x.partNo)+'">'+esc(x.description||'')+' · Grade '+esc(x.grade)+'</option>').join('');const grades=[...new Set((d.grades||[]).filter(x=>String(x.productType).toUpperCase()===prod).map(x=>String(x.grade||'').trim()).filter(Boolean))];$('rbGrade').innerHTML='<option value="">Select Product Grade</option>'+grades.map(g=>'<option>'+esc(g)+'</option>').join('');$('rbWC').innerHTML='<option value="">Select Work Centre</option>'+d.workCentres.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.id)+' · '+esc(x.name)+'</option>').join('');renderMultiParts();S.rbSteps=[];renderRouteSteps();updateRouteId();toggleRouteScope()}
function applyRoutePart(){const d=S.rbData||{},pno=val('rbPart').trim().toUpperCase(),p=(d.parts||[]).find(x=>String(x.partNo).toUpperCase()===pno&&String(x.productType).toUpperCase()===(val('rbProd')||'BOLT').toUpperCase());if(p){$('rbGrade').value=p.grade||'';$('rbPartInfo').innerHTML='<b>Part:</b> '+esc(p.partNo)+' · <b>Grade:</b> '+esc(p.grade)+' · <b>Existing Route:</b> '+esc(p.routeId||'None');updateRouteId();loadExistingRoute()}else if(pno){$('rbPartInfo').innerHTML='<span class="alert">Part No. not found for selected product.</span>'}else{$('rbPartInfo').textContent='Select a Part No.';S.rbSteps=[];renderRouteSteps();updateRouteId();loadExistingRoute()}}
function loadExistingRoute(){const d=S.rbData||{},prod=val('rbProd'),grade=val('rbGrade'),sc=routeScope(),part=val('rbPart'),parts=sc==='MULTIPLE'?selectedPartNos():[];if(!grade&&sc!=='MULTIPLE')return;let rr=[];if(sc==='SINGLE'&&part){const p=(d.parts||[]).find(x=>String(x.partNo).toUpperCase()===String(part).toUpperCase());if(p&&p.routeId)rr=(d.routes||[]).filter(x=>String(x.routeId).toUpperCase()===String(p.routeId).toUpperCase())}else if(sc==='MULTIPLE'&&parts.length){const p=(d.parts||[]).find(x=>String(x.partNo).toUpperCase()===parts[0]);if(p&&p.routeId&&parts.every(n=>{const q=(d.parts||[]).find(x=>String(x.partNo).toUpperCase()===n);return q&&q.routeId===p.routeId}))rr=(d.routes||[]).filter(x=>String(x.routeId).toUpperCase()===String(p.routeId).toUpperCase())}else if(sc==='GRADE'){rr=(d.routes||[]).filter(x=>String(x.productType).toUpperCase()===prod&&String(x.grade).toUpperCase().split('|').includes(String(grade).toUpperCase())&&!String(x.partNo||''));}if(rr.length){rr.sort((a,b)=>Number(a.sequence)-Number(b.sequence));S.rbSteps=rr.map(x=>x.wcId);renderRouteSteps();updateRouteId();toast('Existing route loaded. You can edit the sequence.')}} 
function updateRouteId(){const p=val('rbProd'),g=val('rbGrade'),sc=routeScope(),part=val('rbPart'),parts=selectedPartNos();let label='';if(sc==='MULTIPLE'&&parts.length)label='COMMON_'+parts[0]+'_'+parts.length;else if(sc==='SINGLE'&&part)label=part;else if(g)label='GRADE_'+p; $('rbRouteId').value=(g?'R-'+label+'_'+g.replace(/[^A-Za-z0-9]+/g,'_'):'')}
function renderRouteSteps(){const box=$('selectedSteps');if(!box)return;const ws=(S.rbData||{}).workCentres||[];box.innerHTML=(S.rbSteps||[]).map((id,i)=>{const x=ws.find(w=>w.id===id)||{};return '<div class="row" style="padding:10px;border-bottom:1px solid #edf2f6"><b style="width:35px">'+(i+1)+'</b><span style="flex:1"><b>'+esc(id)+'</b> · '+esc(x.name||'')+'<div class="small muted">Step '+(i+1)+'</div></span><button class="btn secondary rbup" data-i="'+i+'">↑</button><button class="btn secondary rbdown" data-i="'+i+'">↓</button><button class="btn bad rbremove" data-i="'+i+'">×</button></div>'}).join('')||'<p class="muted">No Work Centres selected yet. Add them below in the exact order you want.</p>';box.querySelectorAll('.rbup').forEach(b=>b.onclick=()=>moveStep(Number(b.dataset.i),-1));box.querySelectorAll('.rbdown').forEach(b=>b.onclick=()=>moveStep(Number(b.dataset.i),1));box.querySelectorAll('.rbremove').forEach(b=>b.onclick=()=>{S.rbSteps.splice(Number(b.dataset.i),1);renderRouteSteps();updateRouteId()})}
function moveStep(i,d){const j=i+d;if(j<0||j>=S.rbSteps.length)return;const x=S.rbSteps.splice(i,1)[0];S.rbSteps.splice(j,0,x);renderRouteSteps()}
async function saveRouteBuilder(){try{const sc=routeScope(),parts=selectedPartNos();if(!val('rbGrade'))return toast('Select a product grade.',true);if(!(S.rbSteps||[]).length)return toast('Add at least one Work Centre.',true);if(sc==='MULTIPLE'&&parts.length<2)return toast('Select at least two Part Nos. for a common route.',true);if(sc==='SINGLE'&&!val('rbPart'))return toast('Select a Part No.',true);const r=await call('saveRouteBuilder',[{productType:val('rbProd'),grade:val('rbGrade'),partNo:sc==='SINGLE'?val('rbPart'): '',partNos:sc==='MULTIPLE'?parts:[],steps:S.rbSteps}]);toast((sc==='MULTIPLE'?'Common route assigned to '+parts.length+' Part Nos. — ':'Route saved: ')+r.routeId);await adminPage()}catch(e){toast(e.message||e,true)}}

function userForm(){const c=$('content');c.innerHTML='<div class="card"><h2>Create User</h2><div class="grid2"><input id="uId" class="input" placeholder="User ID"><input id="uName" class="input" placeholder="Name"><input id="uDept" class="input" placeholder="Department" value="PRODUCTION"><input id="uRole" class="input" placeholder="Role" value="OPERATOR"><input id="uPin" class="input" type="password" placeholder="4-8 digit PIN"></div><label><input id="uProd" type="checkbox" checked> Production</label> <label><input id="uQc" type="checkbox"> QC</label> <label><input id="uPack" type="checkbox"> Packing</label> <label><input id="uQr" type="checkbox" checked> QR</label> <label><input id="uAdmin" type="checkbox"> Admin</label><br><button id="saveUser" class="btn">Create</button></div>';$('saveUser').onclick=async()=>{try{await call('createUser',[{userId:val('uId'),name:val('uName'),department:val('uDept'),role:val('uRole'),pin:val('uPin'),allowProduction:$('uProd').checked,allowQC:$('uQc').checked,allowPacking:$('uPack').checked,allowQR:$('uQr').checked,allowAdmin:$('uAdmin').checked}]);toast('User created');await adminPage()}catch(e){toast(e.message||e,true)}}}
function wcForm(){const c=$('content');c.innerHTML='<div class="card"><h2>New Work Centre</h2><div class="grid2"><input id="wcId" class="input" placeholder="WC ID"><input id="wcName" class="input" placeholder="Name"><input id="wcProcess" class="input" placeholder="Process"><input id="wcSeq" class="input" type="number" placeholder="Sequence"><input id="wcMachine" class="input" placeholder="Default Machine"><input id="wcDesc" class="input" placeholder="Description"></div><button id="saveWC" class="btn">Save</button></div>';$('saveWC').onclick=async()=>{try{await call('addWorkCentre',[{id:val('wcId'),name:val('wcName'),process:val('wcProcess'),sequence:Number(val('wcSeq')||99),machine:val('wcMachine'),description:val('wcDesc')}]);toast('Work Centre saved and QR registered');await adminPage()}catch(e){toast(e.message||e,true)}}}
function routeForm(){const c=$('content');c.innerHTML='<div class="card"><h2>Add Route Step</h2><div class="grid2"><input id="routeId" class="input" placeholder="Route ID"><input id="routeProd" class="input" placeholder="Product BOLT/NUT"><input id="routeGrade" class="input" placeholder="Grade or A|5|5.6"><input id="routeSeq" class="input" type="number" placeholder="Sequence"><input id="routeWC" class="input" placeholder="WC ID"><input id="routePart" class="input" placeholder="Part No. optional"></div><button id="saveRouteBtn" class="btn">Save</button></div>';$('saveRouteBtn').onclick=async()=>{try{await call('saveRoute',[{routeId:val('routeId'),productType:val('routeProd'),grade:val('routeGrade'),sequence:Number(val('routeSeq')),wcId:val('routeWC'),partNo:val('routePart'),active:true}]);toast('Route step saved');await adminPage()}catch(e){toast(e.message||e,true)}}}
function partForm(){const c=$('content');c.innerHTML='<div class="card"><h2>Part Master</h2><div class="grid2"><input id="partNo" class="input" placeholder="Part No."><input id="partDesc" class="input" placeholder="Description"><input id="partType" class="input" placeholder="Product BOLT/NUT"><input id="partRM" class="input" placeholder="RM Grade"><input id="partGrade" class="input" placeholder="Product Grade"><input id="partRoute" class="input" placeholder="Route ID (optional — Route Builder can assign it)"><input id="partSize" class="input" placeholder="Size"><input id="partCustomer" class="input" placeholder="Customer"></div><button id="savePartBtn" class="btn">Save</button></div>';$('savePartBtn').onclick=async()=>{try{await call('savePart',[{partNo:val('partNo'),description:val('partDesc'),productType:val('partType'),rawMaterialGrade:val('partRM'),productGrade:val('partGrade'),routeId:val('partRoute'),size:val('partSize'),customer:val('partCustomer'),active:true}]);toast('Part saved');await adminPage()}catch(e){toast(e.message||e,true)}}}
async function saveScannerUrl(){try{const u=await call('saveScannerUrl',[val('scannerurl')]);S.scannerUrl=u;$('scannerInfo').innerHTML='<div class="success">Saved: '+esc(u)+'</div>';toast('Scanner URL saved')}catch(e){toast(e.message||e,true)}}
async function saveWeb(){try{const u=await call('saveWebAppUrl',[val('weburl')]);$('deployInfo').innerHTML='<div class="success">Saved: '+esc(u)+'<br>All QR URLs rebuilt.</div>';toast('Web App URL saved and QRs rebuilt')}catch(e){toast(e.message||e,true)}}
async function logout(){stopBg();try{if(S.token)await call('logout',[])}catch(e){}localStorage.removeItem('gmf_token');S.token='';S.user=null;loginPage()}
async function init(){if(!S.token)return loginPage();try{S.user=await call('me');afterLogin()}catch(e){localStorage.removeItem('gmf_token');S.token='';loginPage()}}
init();
</script></body></html>
